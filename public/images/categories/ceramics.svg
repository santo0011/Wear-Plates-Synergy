<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of hexagonal ceramic wear tiles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c070e"/><stop offset="1" stop-color="#7a1a2c"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f2ee"/><stop offset="1" stop-color="#b9b6b0"/></linearGradient>
    <linearGradient id="carb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c727c"/><stop offset="1" stop-color="#2f3339"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8861b"/><stop offset="1" stop-color="#f0c75e"/></linearGradient>
    <polygon id="hex" points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"/>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <g stroke="#1b1d21" stroke-width="2">
    <use href="#hex" x="250" y="150" fill="url(#tile)"/><use href="#hex" x="333" y="150" fill="url(#tile)"/><use href="#hex" x="416" y="150" fill="url(#gold)"/><use href="#hex" x="499" y="150" fill="url(#tile)"/>
    <use href="#hex" x="208" y="222" fill="url(#tile)"/><use href="#hex" x="291" y="222" fill="url(#carb)"/><use href="#hex" x="374" y="222" fill="url(#tile)"/><use href="#hex" x="457" y="222" fill="url(#tile)"/><use href="#hex" x="540" y="222" fill="url(#carb)"/>
    <use href="#hex" x="250" y="294" fill="url(#tile)"/><use href="#hex" x="333" y="294" fill="url(#tile)"/><use href="#hex" x="416" y="294" fill="url(#carb)"/><use href="#hex" x="499" y="294" fill="url(#tile)"/><use href="#hex" x="582" y="294" fill="url(#tile)"/>
    <use href="#hex" x="291" y="366" fill="url(#gold)"/><use href="#hex" x="374" y="366" fill="url(#tile)"/><use href="#hex" x="457" y="366" fill="url(#tile)"/><use href="#hex" x="540" y="366" fill="url(#carb)"/>
    <use href="#hex" x="333" y="438" fill="url(#tile)"/><use href="#hex" x="416" y="438" fill="url(#tile)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"><circle cx="660" cy="120" r="60"/><circle cx="660" cy="120" r="90"/><circle cx="660" cy="120" r="120"/></g>
  <path d="M100 470H220" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
</svg>

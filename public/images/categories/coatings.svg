<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of a coated pipe with heat waves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c070e"/><stop offset="1" stop-color="#7a1a2c"/></linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset=".45" stop-color="#eef0f3"/><stop offset="1" stop-color="#5b626c"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0c75e"/><stop offset=".45" stop-color="#ffe3a0"/><stop offset="1" stop-color="#9c6f12"/></linearGradient>
    <linearGradient id="coat2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8324a"/><stop offset=".45" stop-color="#cf5a72"/><stop offset="1" stop-color="#5c1020"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <g fill="none" stroke="#f0c75e" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M250 200c-20-25 20-45 0-70s20-45 0-70"/>
    <path d="M330 200c-20-25 20-45 0-70s20-45 0-70" opacity=".6"/>
    <path d="M410 200c-20-25 20-45 0-70s20-45 0-70" opacity=".4"/>
  </g>
  <g stroke="#1b1d21" stroke-width="2">
    <rect x="80" y="250" width="640" height="130" rx="6" fill="url(#pipe)"/>
    <rect x="300" y="236" width="420" height="158" rx="8" fill="url(#coat2)"/>
    <rect x="460" y="226" width="260" height="178" rx="10" fill="url(#coat)"/>
    <ellipse cx="80" cy="315" rx="26" ry="65" fill="#3a3f46"/>
    <ellipse cx="80" cy="315" rx="14" ry="40" fill="#1b1d21"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" opacity=".85" letter-spacing="2">
    <text x="150" y="430">SUBSTRATE</text><text x="320" y="430">CORROSION</text><text x="500" y="440">THERMAL</text>
  </g>
</svg>

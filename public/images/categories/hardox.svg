<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of a fabricated steel hopper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c070e"/><stop offset="1" stop-color="#7a1a2c"/></linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b626c"/><stop offset="1" stop-color="#a7aeb8"/></linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#7d8592"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8861b"/><stop offset="1" stop-color="#f0c75e"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <circle cx="160" cy="120" r="170" fill="#d4a32a" opacity=".06"/>
  <g stroke="#1b1d21" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="230,150 400,210 400,400 330,370" fill="url(#steelL)"/>
    <polygon points="400,210 600,140 480,360 400,400" fill="url(#steelR)"/>
    <polygon points="230,150 430,80 600,140 400,210" fill="#2a2d33"/>
    <polygon points="330,370 400,400 400,470 345,445" fill="#5b626c"/>
    <polygon points="400,400 480,360 470,430 400,470" fill="#9aa1ab"/>
  </g>
  <g stroke="url(#gold)" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round" fill="none">
    <path d="M400 210V400"/><path d="M230 150L400 210L600 140"/><path d="M330 370L400 400L480 360"/>
  </g>
  <g stroke="#1b1d21" stroke-opacity=".35" stroke-width="2" fill="none">
    <path d="M265 200L400 250"/><path d="M295 270L400 310"/><path d="M400 250L560 195"/><path d="M400 310L525 265"/>
  </g>
  <g fill="#f0c75e">

  </g>
  <path d="M560 470H700" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 490H700" stroke="#fff" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>

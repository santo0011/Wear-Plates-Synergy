<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of stacked wear liner plates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c070e"/><stop offset="1" stop-color="#7a1a2c"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d96a3"/><stop offset=".5" stop-color="#c9ced6"/><stop offset="1" stop-color="#7d8592"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8861b"/><stop offset="1" stop-color="#f0c75e"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <circle cx="620" cy="110" r="180" fill="#d4a32a" opacity=".07"/>
  <g stroke="#1b1d21" stroke-width="1.5" stroke-linejoin="round">
    <g transform="translate(0,90)">
      <polygon points="200,300 360,380 360,404 200,324" fill="#4d535c"/>
      <polygon points="360,380 640,280 640,304 360,404" fill="#3a3f46"/>
      <polygon points="200,300 480,200 640,280 360,380" fill="url(#top)"/>
    </g>
    <g transform="translate(0,20)">
      <polygon points="200,300 360,380 360,404 200,324" fill="#4d535c"/>
      <polygon points="360,380 640,280 640,304 360,404" fill="#3a3f46"/>
      <polygon points="200,300 480,200 640,280 360,380" fill="url(#top)"/>
    </g>
    <g transform="translate(0,-50)">
      <polygon points="200,300 360,380 360,404 200,324" fill="#4d535c"/>
      <polygon points="360,380 640,280 640,304 360,404" fill="url(#gold)"/>
      <polygon points="200,300 480,200 640,280 360,380" fill="url(#top)"/>
      <g fill="#2a2d33" stroke="#e6e9ee" stroke-width="2">
        <ellipse cx="300" cy="300" rx="14" ry="8"/><ellipse cx="420" cy="258" rx="14" ry="8"/>
        <ellipse cx="400" cy="340" rx="14" ry="8"/><ellipse cx="520" cy="298" rx="14" ry="8"/>
      </g>
    </g>
  </g>
  <path d="M120 470H360" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 490H260" stroke="#fff" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
</svg>

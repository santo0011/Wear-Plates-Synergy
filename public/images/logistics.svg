    <g fill="#7a1a2c"><circle cx="100" cy="30" r="2.5"/><circle cx="90" cy="30" r="2.5"/><circle cx="80" cy="30" r="2.5"/></g>
  </g>
  <!-- road -->
  <rect x="20" y="330" width="600" height="8" rx="4" fill="#fff" fill-opacity=".15"/>
  <g stroke="url(#gold)" stroke-width="4" stroke-linecap="round"><path d="M60 334H110"/><path d="M170 334H220"/><path d="M500 334H550"/></g>
  <!-- truck -->

    <path d="M194 30H250L286 66V100H194Z" fill="#fff"/>
    <path d="M206 40H244L268 66H206Z" fill="#7a1a2c" fill-opacity=".8"/>
    <g fill="#1b1d21" stroke="#fff" stroke-width="5"><circle cx="45" cy="104" r="18"/><circle cx="145" cy="104" r="18"/><circle cx="246" cy="104" r="18"/></g>
    <g fill="#7a1a2c" opacity=".55"><rect x="18" y="22" width="70" height="10" rx="5"/><rect x="18" y="42" width="110" height="10" rx="5"/></g>
  </g>
  <!-- origin pin -->
  <g transform="translate(70 300)">
    <circle r="22" fill="#f0c75e" fill-opacity=".25"/><circle r="9" fill="#f0c75e"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Illustration of air and surface transport from the plant">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8861b"/><stop offset="1" stop-color="#f0c75e"/></linearGradient>
  </defs>
  <g fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="2" stroke-dasharray="6 10">
    <path d="M70 300C200 120 420 80 590 110"/>
  </g>
  <!-- plane -->
